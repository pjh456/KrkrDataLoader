<html>

<head>
    <link rel='stylesheet' href="./css/menu.css">
    <link rel='stylesheet' href="./css/flex_column.css">
    <link rel='stylesheet' href="./css/text_editor.css">
    <script src="./javascript/scene_file_func.js"></script>
    <!-- <script src="../node_modules/monaco-editor/min/vs/loader.js"></script> -->
    <script>
        editors = [];
    </script>
</head>

<body>
    <div class="main-window">
        <div class="split-view-container">
            <div class="split-view-view" id="top-bar">
                <div id="menu-bar"></div>
            </div>
            <div class="split-view-view" id="content-bar">
                <div class="content-container" id="side-bar">
                    <div id="page-bar">
                        <div class="page-button" id="scene">Scene Load</div>
                        <div class="page-button" id="config">Config</div>
                        <div class="page-button" id="image">Image View </div>
                    </div>
                    <div class="page-button" id="settings">Settings</div>
                </div>
                <div class="content-container" id="scene-loader">
                    <aside id="file-tree-container" style="position:relative;left:0;">
                        <section id="file-tree">
                            <span style="color:white; user-select:none;">Loaded File Path</span>
                            <label id="upload-file-label" for="upload-file">Upload New File</label>
                            <input type="file" id="upload-file" accept=".json" enctype="multipart/form-data" style="display: none;" onchange="upload_scene_file(event)">
                            <file-tree></file-tree>
                        </section>
                    </aside>
                    <!-- <main id="editor-container" style="flex:1;"></main> -->
                    <main id="editor-container" style="flex:1;">
                        <text-editor style="height:100%"></text-editor>
                    </main>
                    <!-- <script src="./javascript/monaco_editor.js"></script> -->
                    <aside id="right-column" style="position:relative;right:0;"></aside>
                </div>
                <div class="content-container" id="config-loader">
                    <!-- <main id="editor-container" style="flex:1;"></main>
                    <script src="./javascript/monaco_editor.js"></script> -->

                </div>
                <div class="content-container" id="image-viewer"></div>
            </div>
            <script>
                function showContainer(elementId){
                    var containers = document.querySelectorAll(".content-container");
                    
                    containers.forEach(container => container.classList.add("hidden"));

                    document.getElementById("side-bar").classList.remove("hidden");
                    const targetContainer = document.getElementById(elementId);
                    if (targetContainer) {
                        targetContainer.classList.remove('hidden');
                    }
                }

                document.getElementById("scene").onclick = ()=>showContainer("scene-loader");

                document.getElementById("config").onclick = ()=>showContainer("config-loader");

                document.getElementById("image").onclick = ()=>showContainer("image-viewer");
                
                showContainer("scene-loader");

            </script>
        </div>
    </div>
</body>
<script type="module">
    import { fileTree } from './javascript/file_tree.js';
    customElements.define('file-tree', fileTree);
</script>

<script type="module">
    import {editor} from './javascript/editor.js'
    customElements.define('text-editor', editor);
</script>
</html>
